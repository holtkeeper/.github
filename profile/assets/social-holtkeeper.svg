<text x="520" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#cdbcad">Keeps a fleet of Git repositories in order:</text><text x="520" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#cdbcad">AI review, dependency updates, audits</text><text x="520" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#cdbcad">and releases on GitLab and GitHub.</text>
